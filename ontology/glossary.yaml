# 용어 사전: 질문 표현 → 정본(개념 / 속성 / 값 집합)
# - canonical 항목은 'Concept', 'Concept.column', 또는 {ref: 'Concept.column', values: [...]} 중 하나다.
# - surface_forms는 같은 뜻의 표현(동의어), confusable_with는 같은 말로 불리지만 다른 대상(혼동어)이다. 둘을 섞지 않는다.
# - 문항 고유 상수(특정 상품명·기관명)는 examples에만 둔다.
# - in_data: false 는 5개 테이블에 없는 개념이다(답할 수 없음을 밝혀야 한다).
# - motivated_by는 추적용 메타데이터이고 프롬프트로 렌더링할 때는 뺀다.

terms:
  # ───────────────────────── 공통 ─────────────────────────
  - id: on_sale
    label: 판매중·판매 가능
    definition: 당사가 지금 고객에게 팔고 있어 고객이 바로 매수할 수 있는 상태다.
    canonical:
      - {ref: DomesticListedProduct.pd_sale_yn, values: ['1']}
      - {ref: OverseasListedProduct.pd_sale_yn, values: ['1']}
      - {ref: FundClass.sale_yn, values: [판매중]}
      - BondLot.buyable_quantity
    scope_tables: [pref01n001, pref02n001, prfd01n001, prbd01n001]
    surface_forms: [판매중, 판매 가능, 판매하는, 살 수 있는, 매수 가능, 지금 살 수 있는]
    confusable_with:
      - {target: FundClass.thco_sale_yn, why: 당사 취급 이력 표시라 판매완료 클래스에도 Y가 있고 판매중 클래스에도 비어 있다}
      - {target: BondLot.trade_price, why: 판매 물량 등록일 뿐이고 남은 수량이 0이면 살 수 없다}
      - {target: pension_eligible, why: '"연금계좌에서 살 수 있다"는 판매 상태가 아니라 계좌 적격성이다'}
    generalized_from: 채권·펀드 문항의 판매 가능 → 국내·해외 상장상품
    evidence: [P-SALE, P-SCOPE, G1, 'profiling:sale_status']
    motivated_by: [C1-01, C1-02, C1-06, C1-07, C2-02, C2-05, C3-03, C3-04, C4-04, C5-02]

  - id: as_of_date
    label: 지금·현재·오늘
    definition: 질문 속 '지금·현재·오늘'은 데이터 스냅샷 기준일인 2026-08-21을 가리킨다.
    canonical: [BondLot.info_base_dt]
    scope_tables: [pref01n001, pref02n001, prfd01n001, prbd01n001, domestic_etf_holdings]
    surface_forms: [지금, 현재, 오늘, 요즘]
    confusable_with:
      - {target: 실제 오늘 날짜, why: 데이터는 스냅샷이라 실제 날짜로 계산하면 만기·기간 결과가 달라진다}
    evidence: [P-DATE]
    motivated_by: [C1-01, C1-02, C3-03]

  - id: net_assets
    label: 순자산·규모
    definition: 상품이 보유한 자산에서 부채를 뺀 순자산 금액이다.
    canonical:
      - DomesticListedProduct.pd_net_tamt
      - OverseasListedProduct.du_last_aum
      - FundClass.fd_nast_suma
    scope_tables: [pref01n001, pref02n001, prfd01n001]
    surface_forms: [순자산, 순자산총액, 규모, AUM, 운용규모]
    confusable_with:
      - {target: DomesticListedProduct.pd_circ_net_tamt, why: 유통분만 센 금액이고 0이 많아 규모 순위가 달라진다}
      - {target: DomesticListedProduct.du_last_aum, why: 일간 원천의 운용자산이라 순자산총액과 값이 조금씩 다르고 ETN은 0이다}
    generalized_from: 국내 ETF 순자산 → 해외 상장상품·펀드 클래스
    evidence: [P-UNITS, 'profiling:net_assets']
    motivated_by: [C3-02, C4-01]

  - id: fee_rate
    label: 보수·총보수·보수율
    definition: 상품을 보유하는 동안 해마다 떼는 비용을 순자산 대비 %로 나타낸 값이다.
    canonical:
      - DomesticListedProduct.cu_charge_rt
      - OverseasListedProduct.cu_charge_rt
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [보수, 총보수, 보수율, 수수료율, 운용보수, 비용]
    confusable_with:
      - {target: front_load_fee, why: 선취수수료는 매수할 때 한 번 내는 판매수수료다}
    note: 펀드 보수 컬럼은 단위가 확인되지 않아 정본에 넣지 않았다(design.md 7절).
    evidence: [P-ZERO, P-UNITS]
    motivated_by: [C1-05, C2-04, C3-05, C5-01]

  - id: period_return
    label: 기간 수익률(1년·3년 수익률)
    definition: 기준일에서 정해진 기간만큼 거슬러 올라간 시점부터 기준일까지의 수익률이다.
    canonical:
      - DomesticListedProduct.du_er_1y
      - FundClass.fd_yr1_ern_r
      - FundClass.fd_yr3_ern_r
    scope_tables: [pref01n001, prfd01n001]
    surface_forms: [1년 수익률, 3년 수익률, 연간 수익률, 최근 1년 성과]
    confusable_with:
      - {target: DomesticListedProduct.pd_dvid_yield, why: 분배수익률은 분배금만 본 수익률이다}
      - {target: future_return, why: 앞으로의 수익률은 데이터에 없다}
    evidence: [P-UNITS, P-OUTLIER]
    motivated_by: [C1-07, C2-02, C3-01, C3-04, C5-02]

  - id: risk_grade
    label: 투자위험등급
    definition: 판매사나 평가사가 매긴 6단계 투자위험 등급으로 1등급이 가장 위험하고 6등급이 가장 덜 위험하다.
    canonical:
      - DomesticListedProduct.pd_risk_nm
      - FundClass.zrin_fd_ivst_risk_grd_nm
      - FundClass.zrin_fd_ivst_risk_gcd
      - Bond.pd_risk_nm
    scope_tables: [pref01n001, prfd01n001, prbd01n001]
    surface_forms: [위험등급, 투자위험등급, 위험도, 매우 높은 위험, 낮은 위험]
    confusable_with:
      - {target: credit_rating, why: 신용등급은 발행자의 채무 상환 능력이고 위험등급은 상품 손실 위험이다}
    order: [매우 높은 위험, 높은 위험, 다소 높은 위험, 보통 위험, 낮은 위험, 매우 낮은 위험]
    generalized_from: 펀드 위험등급 → 국내 상장상품·채권(같은 6단계 이름에 등급 번호가 붙음)
    evidence: ['profiling:risk_grade']
    motivated_by: [C1-07]

  - id: product_name
    label: 상품명
    definition: 질문에서 상품을 가리키는 이름이며 테이블마다 사람들이 부르는 이름이 담긴 컬럼이 다르다.
    canonical:
      - DomesticListedProduct.pd_abrv_nm
      - OverseasListedProduct.pd_abrv_nm
      - FundClass.itm_nm
      - Bond.pd_nm
    scope_tables: [pref01n001, pref02n001, prfd01n001, prbd01n001]
    surface_forms: [상품명, 이름, 종목명, 티커]
    confusable_with:
      - {target: DomesticListedProduct.pd_nm, why: 국내 상장상품의 정식 명칭이라 질문에 쓰는 짧은 이름과 일치하지 않는다}
      - {target: OverseasListedProduct.pd_nm, why: 해외 상장상품의 영문 정식 명칭이고 질문에서는 티커로 부르는 경우가 많다}
    examples: ['KODEX 200, TIGER 200 → 국내 상장상품 약어명']
    generalized_from: 국내 ETF 약어명 → 해외·펀드·채권
    evidence: [P-NAME, S4]
    motivated_by: [C3-01, C4-02, C4-06]

  # ───────────────────────── 채권 ─────────────────────────
  - id: bond_item
    label: 채권 종목
    definition: 채권 개수를 셀 때의 기본 단위로 채권종목번호 하나를 뜻한다.
    canonical: [Bond]
    scope_tables: [prbd01n001]
    surface_forms: [종목, 채권 수, 몇 종목, 몇 개]
    confusable_with:
      - {target: BondLot, why: 판매 건(행)은 같은 종목의 장내·장외·LOT를 따로 센 것이다}
    evidence: [P-UNIT]
    motivated_by: [C1-01, C1-02, C2-03, C2-07, C3-03, C4-05]

  - id: credit_rating
    label: 신용등급
    definition: 신용평가사가 매긴 채권 발행자의 원리금 상환 능력 등급이다.
    canonical: [Bond.crd_grd]
    scope_tables: [prbd01n001]
    surface_forms: [신용등급, 등급, 크레딧]
    confusable_with:
      - {target: risk_grade, why: 상품 투자위험등급과 다른 축이다}
    order: [AAA, AA+, AA0, AA-, A+, A0, A-, BBB+, BBB0, BBB-, BB0, BB-, B+, B-, C0]
    evidence: [P-GRADE]
    motivated_by: [C1-01, C1-02, C4-05]

  - id: krw_currency
    label: 원화(원화채권)
    definition: 원화(KRW)로 표시된 상품이다.
    canonical:
      - {ref: Bond.curr_cd, values: [KRW]}
    scope_tables: [prbd01n001]
    surface_forms: [원화채권, 원화, 원화 표시]
    confusable_with:
      - {target: 국내 발행, why: 국내 기관이 발행해도 외화 표시일 수 있어 통화로 판단한다}
    evidence: [P-ASSET]
    motivated_by: [C1-01]

  - id: maturity
    label: 만기
    definition: 채권 원금이 상환되는 날이다.
    canonical: [Bond.mat_dt]
    scope_tables: [prbd01n001]
    surface_forms: [만기, 만기일, 상환일, 만기가 돌아오는]
    confusable_with:
      - {target: 잔존기간, why: 잔존기간은 기준일부터 만기까지의 길이이고 만기는 날짜다}
    evidence: [P-DATE]
    motivated_by: [C1-02]

  - id: bond_classification
    label: 채권 분류(회사채·특수채·국공채·국고채)
    definition: 채권을 발행 주체에 따라 나눈 표준 분류다.
    canonical:
      - {ref: Bond.std_pd_mcls_nm, values: [회사채, 특수채, 국공채]}
      - Bond.std_pd_scls_nm
    scope_tables: [prbd01n001]
    surface_forms: [회사채, 특수채, 국공채, 국고채, 은행채, 공사채]
    confusable_with:
      - {target: bd_knd, why: 예탁원 채권종류명은 30여 개로 더 잘게 나뉘어 표준 분류와 값이 다르다}
    evidence: ['schema_catalog:std_pd_mcls_nm']
    motivated_by: [C2-03, C2-07]

  - id: coupon_rate
    label: 표면금리
    definition: 채권 발행 조건에 정해진 연 이자율이다.
    canonical: [Bond.srfc_irt]
    scope_tables: [prbd01n001]
    surface_forms: [표면금리, 표면이자율, 쿠폰, 쿠폰금리]
    confusable_with:
      - {target: after_tax_yield, why: 매수 가격을 반영한 투자수익률이다}
      - {target: applied_yield, why: 민평수익률은 시가평가 금리다}
    evidence: [P-UNITS]
    motivated_by: [C2-07]

  - id: after_tax_yield
    label: 세후수익률
    definition: 판매 LOT를 개인이 매수해 만기까지 보유할 때 세금을 뺀 수익률이다.
    canonical: [BondLot.after_tax_yield]
    scope_tables: [prbd01n001]
    surface_forms: [세후수익률, 개인 세후수익률, 세후 금리]
    confusable_with:
      - {target: corp_after_tax_yield, why: 법인 기준 세후수익률이다}
      - {target: avg_annual_tax_yield, why: 세후 연평균수익률 컬럼은 값이 모두 0이라 쓸 수 없다}
    evidence: ['schema_catalog:after_tax_yield']
    motivated_by: [C3-03]

  - id: issuer
    label: 발행기관
    definition: 채권을 발행한 기관이며 질문에서는 약칭으로 부르는 경우가 많다.
    canonical: [Issuer, Bond.pd_pbcm]
    scope_tables: [prbd01n001]
    surface_forms: [발행기관, 발행사, 발행자, '○○이 발행한']
    confusable_with:
      - {target: product_name, why: 채권명에도 기관 이름이 들어가지만 발행기관 집계는 발행기관명으로 한다}
    examples: ['기업은행 → (주)중소기업은행']
    evidence: [P-NAME, 'profiling:issuer_names']
    motivated_by: [C4-05]

  # ───────────────────────── 펀드 ─────────────────────────
  - id: fund_class
    label: 클래스
    definition: 같은 펀드를 수수료·판매채널·투자자 조건으로 나눈 판매 단위이며 펀드 개수의 기본 단위다.
    canonical: [FundClass]
    scope_tables: [prfd01n001]
    surface_forms: [클래스, 펀드(기본 단위), 몇 개]
    confusable_with:
      - {target: representative_fund, why: 대표펀드 기준이라고 하면 클래스를 묶어서 센다}
      - {target: prfd01n001.han_clas_nm, why: 클래스 한글 표기는 여러 펀드가 공유하는 유형 이름이라 클래스를 식별하지 못한다}
    evidence: [P-UNIT]
    motivated_by: [C1-06, C1-07, C2-05, C3-04]

  - id: representative_fund
    label: 대표펀드
    definition: 여러 클래스가 공유하는 하나의 펀드다.
    canonical: [Fund, FundClass.rptt_ksd_itm_no]
    scope_tables: [prfd01n001]
    surface_forms: [대표펀드, 대표펀드 기준, 클래스 말고 펀드 단위]
    confusable_with:
      - {target: fund_class, why: 클래스 행을 그대로 세면 같은 펀드가 여러 번 들어간다}
    evidence: [P-UNIT]
    motivated_by: [C4-04]

  - id: public_offering
    label: 공모
    definition: 불특정 다수에게 공개적으로 모집하는 상품이다.
    canonical:
      - {ref: FundClass.prvo_pbff_desc, values: [공모]}
    scope_tables: [prfd01n001]
    surface_forms: [공모, 공모펀드]
    confusable_with:
      - {target: 사모, why: 사모 클래스는 유형·수익률·위험등급이 거의 비어 있다}
    evidence: ['profiling:private_fund_attributes']
    motivated_by: [C1-06, C1-07, C2-02, C2-05, C3-04, C4-04, C5-02]

  - id: fund_type
    label: 펀드 유형
    definition: 펀드를 투자 자산과 지역에 따라 나눈 유형이며 정본 분류 체계는 제로인 대유형이다.
    canonical: [FundClass.zrin_btyp_nm]
    scope_tables: [prfd01n001]
    surface_forms: [주식형, 채권형, 해외주식형, 해외채권형, 혼합형, 유형]
    confusable_with:
      - {target: FundClass.or_attr_desc, why: 운용속성은 국내·해외를 나누지 않고 재간접 같은 운용 방식이 섞여 유형 집합이 다르다}
      - {target: prfd_attr_cds, why: 속성 코드·명칭 목록은 유형 분류가 아니라 펀드 속성 태그다}
    evidence: [P-ASSET, G2]
    motivated_by: [C1-06, C1-07, C2-02, C3-04, C5-02]

  - id: domestic_fund_type
    label: 국내 ○○형 펀드
    definition: 국내주식형·국내채권형처럼 '국내'를 붙인 펀드 유형은 제로인 대유형에서 '해외' 접두어가 없는 같은 이름의 유형이다.
    canonical:
      - {ref: FundClass.zrin_btyp_nm, values: [주식형, 채권형, 주식혼합형, 채권혼합형]}
    scope_tables: [prfd01n001]
    surface_forms: [국내주식형, 국내채권형, 국내 주식형 펀드]
    confusable_with:
      - {target: fund_type, why: 대유형 값에 '국내주식형'이라는 문자열은 없다}
    evidence: [P-ASSET, G2]
    motivated_by: [C5-02]

  - id: mmf
    label: MMF
    definition: MMF는 제로인 대유형의 MMF와 외화 MMF를 모두 가리킨다.
    canonical:
      - {ref: FundClass.zrin_btyp_nm, values: [MMF, 외화 MMF]}
    scope_tables: [prfd01n001]
    surface_forms: [MMF, 머니마켓펀드, 단기금융펀드]
    confusable_with:
      - {target: FundClass.or_attr_desc, why: 운용속성 MMF는 제로인 대유형 MMF와 집합이 다르다}
      - {target: DomesticListedProduct.wu_inv_ast_type, why: 상장상품의 '단기자금'은 펀드 유형이 아니라 상장상품의 자산군이다}
    evidence: [P-ASSET, G2, 'profiling:mmf_currency']
    motivated_by: [C2-05]

  - id: sales_channel
    label: 판매채널(온라인 전용)
    definition: 클래스를 파는 경로이며 '온라인 전용'은 판매채널이 온라인인 클래스다.
    canonical:
      - {ref: FundClass.han_clas_sales_channel, values: [온라인, 오프라인, 직판]}
    scope_tables: [prfd01n001]
    surface_forms: [온라인 전용, 온라인 클래스, 오프라인]
    confusable_with:
      - {target: e 클래스 표기, why: 종목명의 '-e'는 표기 관행일 뿐이고 판매채널 컬럼이 정본이다}
    evidence: ['schema_catalog:han_clas_sales_channel']
    motivated_by: [C1-06]

  - id: front_load_fee
    label: 선취수수료
    definition: 펀드를 살 때 미리 떼는 판매수수료다.
    canonical:
      - {ref: FundClass.han_clas_fee_type, values: [수수료선취, 수수료미징구, 수수료후취]}
    scope_tables: [prfd01n001]
    surface_forms: [선취수수료, 선취, 선취수수료 없는, 수수료 없는]
    confusable_with:
      - {target: fee_rate, why: 보수는 보유 기간 동안 해마다 떼는 비용이다}
    note: 선취수수료가 없는 클래스는 수수료미징구 클래스다.
    evidence: ['schema_catalog:han_clas_fee_type']
    motivated_by: [C1-06]

  # ───────────────────────── 상장상품 ─────────────────────────
  - id: etf
    label: ETF
    definition: 지수를 추종하도록 설계되어 거래소에 상장된 펀드다.
    canonical:
      - {ref: DomesticListedProduct.pd_grp_no, values: [ETF]}
      - {ref: OverseasListedProduct.pd_grp_no, values: [ETF]}
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [ETF, 상장지수펀드]
    confusable_with:
      - {target: etn, why: 같은 테이블에 섞여 있어 상품군종류로 나눠야 한다}
      - {target: OverseasListedProduct.cu_etn_yn, why: ETN 여부는 Y만 있어 'N'으로 ETF를 찾으면 0행이다}
    evidence: [P-PRODUCT]
    motivated_by: [C1-03, C1-05, C2-01, C2-04, C3-01, C3-02, C3-05, C5-01]

  - id: etn
    label: ETN
    definition: 증권사가 발행해 기초지수 수익률을 약속하는 거래소 상장 채무증권이다.
    canonical:
      - {ref: DomesticListedProduct.pd_grp_no, values: [ETN]}
      - {ref: OverseasListedProduct.pd_grp_no, values: [ETN]}
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [ETN, 상장지수증권]
    confusable_with:
      - {target: etf, why: 같은 테이블에 섞여 있다}
    generalized_from: 국내 ETN → 해외 ETN
    evidence: [P-PRODUCT]
    motivated_by: [C2-06]

  - id: etp
    label: ETP·상장상품
    definition: ETF와 ETN을 함께 가리키는 거래소 상장상품 전체다.
    canonical: [DomesticListedProduct, OverseasListedProduct]
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [ETP, 상장상품, 상장지수상품]
    confusable_with:
      - {target: etf, why: ETF만 세면 ETN이 빠진다}
    evidence: [P-PRODUCT]
    motivated_by: [C2-06]

  - id: asset_class
    label: 자산군(주식형·채권형 상장상품)
    definition: 상장상품이 주로 투자하는 자산의 종류다.
    canonical:
      - {ref: DomesticListedProduct.wu_inv_ast_type, values: [주식, 채권, 원자재, 대체투자, 혼합자산, 단기자금, 기타, 통화, 부동산]}
      - {ref: OverseasListedProduct.wu_inv_ast_type, values: [Equity, Alternatives, Bond, Mixed Assets, Commodity, Money Market]}
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [주식형, 채권형, 원자재, 자산군, 투자자산]
    confusable_with:
      - {target: ref_ast_type, why: Refinitiv 자산유형은 국내 상장상품의 32%가 비어 있는 별도 분류다}
      - {target: fund_type, why: 펀드의 주식형·채권형은 제로인 대유형으로 본다}
    evidence: [P-ASSET]
    motivated_by: [C1-03, C1-05, C2-01, C3-01, C3-02]

  - id: investment_region
    label: 투자지역
    definition: 상장상품이 투자하는 지역이며 '국내 주식에 투자하는'처럼 지역과 자산을 함께 말하면 둘 다 조건이 된다.
    canonical: [DomesticListedProduct.wu_inv_rgn]
    scope_tables: [pref01n001]
    surface_forms: [국내, 미국, 글로벌, '○○에 투자하는']
    confusable_with:
      - {target: 상장 시장, why: 국내 상장상품이라도 투자지역은 미국·글로벌일 수 있다}
    evidence: [P-ASSET, 'design§8:국내 주식 투자 해석']
    motivated_by: [C1-03, C3-01]

  - id: pension_eligible
    label: 연금계좌 매수 가능
    definition: 연금저축·IRP 같은 연금계좌에서 매수할 수 있는 상장상품이다.
    canonical:
      - {ref: DomesticListedProduct.pd_pen_tr_yn, values: ['Y']}
    scope_tables: [pref01n001]
    surface_forms: [연금계좌, 연금계좌에서 살 수 있는, 연금 가능]
    confusable_with:
      - {target: prbd01n001.pd_pen_tr_yn, why: 채권의 같은 이름 컬럼은 퇴직연금 편입 가능 여부라 뜻이 다르다}
      - {target: on_sale, why: 판매 상태와는 다른 조건이다}
    evidence: ['schema_catalog:pd_pen_tr_yn']
    motivated_by: [C1-03]

  - id: distribution_cycle
    label: 분배 주기(월분배)
    definition: 상장상품이 분배금을 주는 주기다.
    canonical:
      - {ref: DomesticListedProduct.pd_dvid_cycl, values: [M, Q, S, A]}
    scope_tables: [pref01n001]
    surface_forms: [매달 분배, 월분배, 월배당, 분기 분배, 연 1회 분배]
    confusable_with:
      - {target: pref01n001.pd_dvid_pay_cnt, why: 연간 지급횟수는 같은 정보를 숫자로 적은 보조 컬럼이다}
    note: M은 월, Q는 분기, S는 반기, A는 연이다.
    evidence: ['schema_catalog:pd_dvid_cycl']
    motivated_by: [C1-04]

  - id: leverage
    label: 레버리지
    definition: 기초자산 일간 수익률의 1배를 넘는 배수를 추종하는 상장상품이다.
    canonical: [DomesticListedProduct.cu_lev_fector, OverseasListedProduct.cu_lev_fector]
    scope_tables: [pref01n001, pref02n001]
    surface_forms: [레버리지, 2배, 3배, 2X]
    confusable_with:
      - {target: 인버스, why: 반대 방향 상품이며 국내 상장상품의 배수 부호로는 구분되지 않는다}
    note: 국내 상장상품은 인버스 상품도 배수가 크기(예 '2')로만 적힌 경우가 많아, 배수 1 초과로 고른 레버리지에 인버스 2배 상품이 섞인다. 정의는 배수 기준을 그대로 쓴다.
    generalized_from: 국내 ETN → 국내 ETF·해외 상장상품
    evidence: ['design§8:배수 기준 레버리지 비율', 'profiling:leverage_factor']
    motivated_by: [C2-06]

  # ───────────────────────── 구성종목 ─────────────────────────
  - id: holding
    label: 구성종목·편입
    definition: 국내 ETF가 담고 있는 종목이며 '편입했다'는 그 ETF의 구성종목 목록에 종목명이 있다는 뜻이다.
    canonical: [Holding, Holding.component_name]
    scope_tables: [domestic_etf_holdings]
    surface_forms: [구성종목, 편입, 담고 있는, 들어 있는, 보유 종목]
    confusable_with:
      - {target: holding_weight, why: 편입 여부는 알 수 있지만 비중은 데이터에 없다}
    note: 구성종목 데이터는 국내 ETF에만 있다. 영문 종목명은 운용사마다 대소문자 표기가 달라 같은 종목이 여러 표기로 등재될 수 있다(정확히 일치 기준은 그대로 쓴다).
    evidence: [P-CASH, P-NAME, 'profiling:holding_name_case']
    motivated_by: [C4-01, C4-02, C4-03, C4-06]

  - id: cash_like_holding
    label: 현금성 항목
    definition: 구성종목 목록에 등재되지만 투자 종목이 아닌 예금·현금 설정분이다.
    canonical:
      - {ref: Holding.component_name, values: [원화예금, 설정현금액, 원화현금, 현금성자산, 100%현금설정액]}
    scope_tables: [domestic_etf_holdings]
    surface_forms: [현금, 예금, 설정현금]
    confusable_with:
      - {target: holding, why: 구성종목 수와 비교에서 빼야 하는 항목이다}
    evidence: [P-CASH, 'profiling:cash_names']
    motivated_by: [C4-02, C4-06]

  # ───────────────────────── 데이터에 없는 개념 ─────────────────────────
  - id: holding_weight
    label: 편입 비중
    definition: ETF 순자산에서 특정 구성종목이 차지하는 비율이다.
    in_data: false
    canonical: []
    scope_tables: [domestic_etf_holdings]
    surface_forms: [비중, 편입 비중, 보유 비율, 몇 % 담고]
    confusable_with:
      - {target: holding, why: 편입 여부만 데이터에 있다}
    evidence: [P-OOS]
    motivated_by: [C6-02]

  - id: corporate_group
    label: 자회사·계열 관계
    definition: 기업 사이의 지분 지배 관계다.
    in_data: false
    canonical: []
    scope_tables: []
    surface_forms: [자회사, 계열사, 그룹사, 지배구조]
    confusable_with:
      - {target: 이름 부분 일치, why: 이름이 비슷하다고 계열 관계가 확인되지는 않는다}
    evidence: [P-OOS]
    motivated_by: [C6-01]

  - id: future_return
    label: 미래 수익률·추천
    definition: 앞으로의 수익률 예측이나 특정 상품 매수 권유다.
    in_data: false
    canonical: []
    scope_tables: []
    surface_forms: [다음 달 수익률, 오를 것 같은, 찍어줘, 추천]
    confusable_with:
      - {target: period_return, why: 과거 기간 수익률은 조회할 수 있다}
    evidence: [P-OOS]
    motivated_by: [C6-03]
