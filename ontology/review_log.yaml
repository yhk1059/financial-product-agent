  - date: 2026-10-18
    scope: 채권 glossary·rules (bond_item, credit_rating, krw_currency, maturity, bond_classification, coupon_rate, after_tax_yield, issuer / R-sale-bond, R-bond-unit-item, R-bond-unit-sale-count, R-bond-item-best-lot, R-credit-grade-order, R-period-window)
