  - date: 2026-10-18
    scope: 공통 glossary·rules (on_sale, as_of_date, net_assets, fee_rate, period_return, risk_grade, product_name, holding_weight, corporate_group, future_return / R-scope-default, R-null-exclude, R-topn-nulls, R-units, R-outlier-raw, R-as-of-date, R-risk-grade-order, R-name-exact, R-name-resolve, R-oos-refusal)
