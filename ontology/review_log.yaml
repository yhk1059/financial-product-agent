    scope: 해외 ETF·ETN rules (R-sale-overseas-listed, R-zero-is-value, R-cross-table-compare)
    result: 승인
    notes: R-zero-is-value에 채권 표면이자율을 함께 두어 '0은 기본적으로 실제 값이고 예외는 속성 정의에 적는다'는 원칙을 유지한다.
  - date: 2026-10-18
    scope: 구성종목 glossary·rules (holding, cash_like_holding / R-holding-etf-count, R-holding-component-count, R-cash-exclusion, R-holding-set-logic)
