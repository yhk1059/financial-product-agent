  - date: 2026-10-18
    scope: 펀드 glossary·rules (fund_class, representative_fund, public_offering, fund_type, domestic_fund_type, mmf, sales_channel, front_load_fee / R-sale-fund, R-fund-unit-class, R-fund-unit-representative)
