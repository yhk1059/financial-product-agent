    result: 승인
    notes: R-zero-missing을 유통순자산총액·최종AUM의 0까지 넓힌 것을 유지한다. 레버리지는 배수 1 초과 정의를 그대로 두고, 인버스 2배 상품이 섞인다는 점을 leverage note에 적는다(골든 정답 유지). 투자지역은 국내 테이블에만 둔다.
