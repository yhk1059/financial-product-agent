open_questions:
  - id: q-cash-list
    question: 현금성 항목에 '현금', 'USD현금', '[USD] 예금'을 더할까요(P-CASH 변경, 골든 정답이 바뀔 수 있음)?
    related: [keep-p-cash-list]
    resolved: 2026-10-18 현행 유지. 골든 정답이 바뀌면 기준선과 비교할 수 없으므로 문항을 80~120개로 늘리는 v3에서 P-CASH 개정과 함께 다시 본다.
  - id: q-overseas-leverage-null
    question: 해외 상장상품 배수 결측을 레버리지 판정에서 '1배'로 볼까요, 결측으로 뺄까요?
    related: [keep-overseas-leverage-null]
    resolved: 2026-10-18 규칙을 만들지 않고 미확인으로 둔다. 이 지식을 요구하는 문항이 없다. 질문이 생기면 상품명 패턴과 함께 데이터로 검증해 규칙을 만든다.

