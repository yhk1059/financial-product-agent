# 에이전트 평가 질문셋
# - gold_sql: 정답 쿼리. 결과의 expect_column 값이 모두 답변 텍스트에 나오면 통과.
# - expect_column 생략 시 첫 번째 컬럼을 쓴다. 숫자는 소수점 이하 반올림한 정수 문자열로도 매칭한다.

- id: etf_count_by_type
  question: 국내 상장 ETF와 ETN은 각각 몇 개야?
  gold_sql: SELECT count(*) FROM pref01n001 GROUP BY pd_grp_no ORDER BY pd_grp_no

- id: domestic_bond_etf_top_1y
  question: 판매중인 국내 채권형 ETF 중 1년 수익률 상위 3개 상품명을 알려줘
  gold_sql: |
    SELECT pd_nm FROM pref01n001
    WHERE pd_grp_no='ETF' AND pd_sale_yn='1' AND wu_inv_ast_type='채권' AND du_er_1y IS NOT NULL
    ORDER BY du_er_1y DESC LIMIT 3

- id: domestic_etf_pension_count
  question: 연금계좌에서 거래 가능한 국내 ETF는 몇 개야?
  gold_sql: SELECT count(*) FROM pref01n001 WHERE pd_grp_no='ETF' AND pd_pen_tr_yn='Y'

- id: domestic_us_etf_top_aum
  question: 미국에 투자하는 국내 ETF 중 순자산총액이 가장 큰 3개는?
  gold_sql: |
    SELECT pd_nm FROM pref01n001
    WHERE pd_grp_no='ETF' AND wu_inv_rgn='미국' AND pd_net_tamt IS NOT NULL
    ORDER BY pd_net_tamt DESC LIMIT 3

- id: domestic_monthly_dividend_count
  question: 월배당(매월 분배) 국내 ETF는 몇 개야?
  gold_sql: SELECT count(*) FROM pref01n001 WHERE pd_grp_no='ETF' AND pd_dvid_cycl='M'

- id: overseas_lowest_fee
  question: 해외 ETF 중 가장 낮은 보수율은 몇 %야? (보수 0은 미입력이니 제외)
  gold_sql: SELECT min(cu_charge_rt) FROM pref02n001 WHERE pd_grp_no='ETF' AND cu_charge_rt > 0

- id: overseas_leverage_count
  question: 해외 레버리지 ETF(배수 1배 초과)는 몇 개야?
  gold_sql: SELECT count(*) FROM pref02n001 WHERE pd_grp_no='ETF' AND cu_lev_fector > 1

- id: overseas_bond_etf_count
  question: 해외 채권형 ETF는 몇 개야?
  gold_sql: SELECT count(*) FROM pref02n001 WHERE pd_grp_no='ETF' AND wu_inv_ast_type='Bond'

- id: fund_public_on_sale_count
  question: 현재 판매중인 공모펀드는 몇 개야?
  gold_sql: SELECT count(*) FROM prfd01n001 WHERE prvo_pbff_desc='공모' AND sale_yn='판매중'

- id: fund_type_distribution
  question: 판매중인 공모펀드를 제로인 대유형별로 개수 세서 상위 3개 유형 알려줘
  gold_sql: |
    SELECT zrin_btyp_nm FROM prfd01n001
    WHERE prvo_pbff_desc='공모' AND sale_yn='판매중' AND zrin_btyp_nm IS NOT NULL
    GROUP BY 1 ORDER BY count(*) DESC LIMIT 3

- id: fund_top_1y_equity
  question: 판매중인 공모 주식형 펀드(제로인 대유형 '주식형') 중 1년 수익률이 가장 높은 펀드는?
  gold_sql: |
    SELECT itm_nm FROM prfd01n001
    WHERE prvo_pbff_desc='공모' AND sale_yn='판매중' AND zrin_btyp_nm='주식형' AND fd_yr1_ern_r IS NOT NULL
    ORDER BY fd_yr1_ern_r DESC LIMIT 1

- id: bond_distinct_count
  question: 채권 테이블에 있는 채권 종목은 중복 없이 몇 개야?
  gold_sql: SELECT count(DISTINCT pd_no) FROM prbd01n001

- id: bond_buyable_count
  question: 당사에서 매수 가능한(판매중인) 채권은 몇 건이야?
  gold_sql: SELECT count(*) FROM prbd01n001 WHERE trade_price IS NOT NULL

- id: bond_aaa_govt_count
  question: 국고채는 몇 종목이야?
  gold_sql: SELECT count(DISTINCT pd_no) FROM prbd01n001 WHERE std_pd_scls_nm='국고채'

- id: bond_top_buy_yield
  question: 매수 가능한 채권 중 매수수익률이 가장 높은 채권 이름은?
  gold_sql: |
    SELECT pd_nm FROM prbd01n001 WHERE buy_yield IS NOT NULL ORDER BY buy_yield DESC LIMIT 1

- id: holdings_samsung_count
  question: 삼성전자를 편입한 국내 ETF는 몇 개야?
  gold_sql: SELECT count(DISTINCT item_id) FROM domestic_etf_holdings WHERE component_name='삼성전자'

- id: holdings_most_common
  question: 국내 ETF에 가장 많이 편입된 종목 1위는? (현금성 항목 제외)
  gold_sql: |
    SELECT component_name FROM domestic_etf_holdings
    WHERE component_name NOT IN ('원화예금', '설정현금액', '원화현금', '현금성자산', '100%현금설정액')
    GROUP BY 1 ORDER BY count(DISTINCT item_id) DESC LIMIT 1

- id: holdings_etf_component_count
  question: KODEX 200 ETF의 구성종목 수는?
  gold_sql: |
    SELECT count(*) FROM domestic_etf_holdings h JOIN pref01n001 p ON p.pd_itm_no = h.item_id
    WHERE p.pd_abrv_nm = 'KODEX 200'
